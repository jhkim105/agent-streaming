[project]
name = "agent-worker"
version = "0.1.0"
description = "Real-time AI Researcher Agent Python Worker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "duckduckgo-search>=6.0.0",
    "confluent-kafka>=2.5.0",
    "pydantic>=2.8.0",
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
agent-worker = "src.main:main"

